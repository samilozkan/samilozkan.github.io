---
layout: default
published: true
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <p class="post-info">
    <span>{{ page.date | date: "%B %-d, %Y" }}</span>
    {% for tag in page.tags limit: 4 %}<span class="post-tag">#{{ tag }}</span>{% endfor %}
  </p>

  <div class="entry">
    {{ content }}
  </div>

  {% if page.medium_url %}
  <p class="note post-origin">Originally published on <a href="{{ page.medium_url }}" target="_blank" rel="noopener">Medium</a>.</p>
  {% endif %}
  <p class="note"><a href="{{ site.baseurl }}/blog/">&larr; All posts</a></p>
</article>
